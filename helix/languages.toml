[[language]]
name = "go"
auto-format = true
formatter = { command = "goimports" }
language-servers = ["gopls"]

[language-server.gopls.config]
hints = { assignVariableTypes = true, compositeLiteralFields = true, compositeLiteralTypes = true, constantValues = true, functionTypeParameters = true, parameterNames = true, rangeVariableTypes = true }
analyses = { unusedparams = true, unusedwrite = true, shadow = true }

[[language]]
name = "rust"
auto-format = true
formatter = { command = "rustfmt" }
language-servers = ["rust-analyzer"]

[language-server.rust-analyzer.config]
cargo = { allFeatures = true }
check = { command = "clippy" }
inlayHints = { bindingModeHints = { enable = true }, closingBraceHints = { enable = true, minLines = 10 }, closureReturnTypeHints = { enable = "with_block" }, discriminantHints = { enable = "fieldless" }, lifetimeElisionHints = { enable = "skip_trivial", useParameterNames = true }, reborrowHints = { enable = "always" }, renderColons = true, typeHints = { enable = true, hideClosureInitialization = false, hideNamedConstructor = false } }

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config]
basedpyright.analysis.typeCheckingMode = "standard"
basedpyright.analysis.autoImportCompletions = true

[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "python"
auto-format = true
formatter = { command = "ruff", args = ["format", "-"] }
language-servers = ["basedpyright", "ruff"]

[[language]]
name = "javascript"
auto-format = true
formatter = { command = "deno", args = ["fmt", "-"] }

[[language]]
name = "typescript"
auto-format = true
formatter = { command = "deno", args = ["fmt", "-"] }

[[language]]
name = "tsx"
auto-format = true
formatter = { command = "deno", args = ["fmt", "-"] }

[[language]]
name = "jsx"
auto-format = true
formatter = { command = "deno", args = ["fmt", "-"] }

[[language]]
name = "json"
auto-format = true
formatter = { command = "deno", args = ["fmt", "-"] }

[[language]]
name = "lua"
auto-format = true
formatter = { command = "stylua", args = ["-" ] }
language-servers = ["lua-language-server"]
